<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
  </defs>
  <!-- Rounded Base Background -->
  <rect width="512" height="512" rx="112" fill="url(#grad)" />
  
  <!-- Inner Glow Shield -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="6" />
  
  <!-- Modern Geometric Cube / Network Nodes -->
  <g transform="translate(256, 210)">
    <!-- Graduation Cap & Network Polygon -->
    <path d="M 0 -70 L 120 -10 L 0 50 L -120 -10 Z" fill="#FFFFFF" />
    <path d="M -120 -10 L 0 50 L 0 110 L -120 50 Z" fill="#E2E8F0" />
    <path d="M 120 -10 L 0 50 L 0 110 L 120 50 Z" fill="#CBD5E1" />
    
    <!-- Core Diamond Node -->
    <circle cx="0" cy="-10" r="16" fill="#2563EB" />
  </g>
  
  <!-- Bold TMJ Typography -->
  <text x="256" y="380" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="80" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">TMJ</text>
  
  <!-- Subtitle Tag -->
  <text x="256" y="430" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" fill="#93C5FD" text-anchor="middle" letter-spacing="6">CLASS SYSTEM</text>
</svg>
